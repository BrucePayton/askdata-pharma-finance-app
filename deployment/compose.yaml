name: askdata-pharma-finance-app

services:
  pharma-web:
    image: ${PHARMA_WEB_IMAGE:?set PHARMA_WEB_IMAGE}
    build:
      context: ../frontend
      args:
        PHARMA_WEB_BASE: /pharma-finance/
    restart: unless-stopped
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O- http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  pharma-edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PHARMA_HTTP_BIND:-127.0.0.1}:${PHARMA_HTTP_PORT:-18190}:80"
    environment:
      PLATFORM_API_URL: ${PLATFORM_API_URL:?set PLATFORM_API_URL}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks: [app]
    depends_on:
      pharma-web:
        condition: service_healthy

networks:
  app: {}
